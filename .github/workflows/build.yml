name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check with ty
        run: uv run ty check .

      - name: Run tests
        # pytest exits 5 when no tests are collected; treat that as success
        # while the suite is still empty.
        run: uv run pytest || [ $? -eq 5 ]

  build-linux:
    name: Build Linux .AppImage
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync build dependencies
        run: uv sync --frozen --group build

      - name: Run PyInstaller
        run: uv run pyinstaller --noconfirm --clean --name telegram-monitor --onedir entry.py

      - name: Stage AppDir
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/telegram-monitor/. AppDir/usr/bin/
          cp packaging/telegram-monitor.desktop AppDir/usr/share/applications/telegram-monitor.desktop
          cp packaging/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/telegram-monitor.png

      - name: Fetch linuxdeploy
        run: |
          curl -fsSL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/telegram-monitor.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/telegram-monitor.png \
            --output appimage
          mv Telegram_Monitor-x86_64.AppImage telegram-monitor-x86_64.AppImage

      - name: Smoke check (boot + migrate)
        env:
          TGM_DB_PATH: ${{ runner.temp }}/smoke.sqlite
        run: ./telegram-monitor-x86_64.AppImage --appimage-extract-and-run chat remove 0

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: telegram-monitor-linux
          path: telegram-monitor-x86_64.AppImage

  build-windows:
    name: Build Windows .exe
    needs: lint-and-test
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync build dependencies
        run: uv sync --frozen --group build

      - name: Run PyInstaller
        run: uv run pyinstaller --noconfirm --clean --name telegram-monitor --onefile entry.py

      - name: Smoke check (boot + migrate)
        shell: pwsh
        env:
          TGM_DB_PATH: ${{ runner.temp }}\smoke.sqlite
        run: dist\telegram-monitor.exe chat remove 0

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: telegram-monitor-windows
          path: dist/telegram-monitor.exe

  release:
    name: Attach artifacts to GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: telegram-monitor-linux
          path: artifacts/

      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: telegram-monitor-windows
          path: artifacts/

      - name: Create / update Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/telegram-monitor-x86_64.AppImage
            artifacts/telegram-monitor.exe
