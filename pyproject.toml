[project]
name = "tgm"
version = "0.1.0"
description = "Personal desktop monitor of Telegram chats with LLM-powered digests"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "d4nnie", email = "dshchepetilnikov@gmail.com" }]
dependencies = [
    "click>=8.3.3",
    "httpx>=0.28",
    "platformdirs>=4.9.6",
    "pydantic>=2.10",
    "sqlalchemy>=2.0.49",
    "telethon>=1.43.2",
    "tomli-w>=1.2.0",
]

[project.scripts]
telegram-monitor = "tgm.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgm"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.34",
    "wemake-python-styleguide>=1.6.2",
]
build = ["pyinstaller>=6.16.0", "taskipy>=1.14.1"]

[tool.taskipy.tasks]
build-linux = """
set -e
rm -rf build dist AppDir telegram-monitor-x86_64.AppImage
uv sync --frozen --group build
uv run pyinstaller --noconfirm --clean --name telegram-monitor --onedir --collect-data tgm.shell.db.migrations entry.py
mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
cp -r dist/telegram-monitor/. AppDir/usr/bin/
cp packaging/telegram-monitor.desktop AppDir/usr/share/applications/telegram-monitor.desktop
cp packaging/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/telegram-monitor.png
test -x linuxdeploy-x86_64.AppImage || { curl -fsSL -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage && chmod +x linuxdeploy-x86_64.AppImage; }
./linuxdeploy-x86_64.AppImage --appimage-extract-and-run --appdir AppDir --desktop-file AppDir/usr/share/applications/telegram-monitor.desktop --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/telegram-monitor.png --output appimage
mv Telegram_Monitor-x86_64.AppImage telegram-monitor-x86_64.AppImage
"""

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "C90", "PLR0915", "PLR0916", "PLR1702", "S101"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-statements = 10
max-bool-expr = 3
max-nested-blocks = 3

[tool.ruff.lint.per-file-ignores]
# Tests can assert freely; flow-walk E2E tests legitimately accumulate
# statements (arrange-act-assert across many states); shell/platform.py
# contains Win32 ctypes glue whose decomposition would scatter the API binding.
"tests/**" = ["S101", "PLR0915"]
"tgm/shell/platform.py" = ["PLR0915"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
