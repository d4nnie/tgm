[project]
name = "tgm"
version = "0.1.0"
description = "Personal desktop monitor of Telegram chats with LLM-powered digests"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "d4nnie", email = "dshchepetilnikov@gmail.com" }]
dependencies = []

[project.scripts]
telegram-monitor = "tgm.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgm"]

[dependency-groups]
dev = ["pre-commit>=4.6.0", "pytest>=9.0.3", "ruff>=0.15.12", "ty>=0.0.34"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
